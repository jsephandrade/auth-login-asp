<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password | Print Shop</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Print Shop</p>
      <h1>Recover account</h1>
      <p class="subtext">Verify the 6-digit code, then set a new password.</p>
    </section>

    <section class="card" aria-label="Forgot Password">
      <div id="message" class="message hidden" aria-live="polite"></div>

      <div class="flip-wrap">
        <div id="resetFlipCard" class="flip-card">
          <section class="flip-face flip-front">
            <h2 class="face-title">Verify Reset Code</h2>
            <label for="emailInput">Email</label>
            <input id="emailInput" type="email" autocomplete="email" placeholder="name@company.com" />

            <div class="verify-actions">
              <button id="sendCodeBtn" class="btn secondary" type="button">Send Code</button>
              <button id="resendCodeBtn" class="btn secondary ghost" type="button">Resend Code</button>
            </div>

            <div class="otp-grid otp-reset" role="group" aria-label="6 digit reset code">
              <input class="otp-input" data-reset-otp-index="0" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" />
              <input class="otp-input" data-reset-otp-index="1" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" />
              <input class="otp-input" data-reset-otp-index="2" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" />
              <input class="otp-input" data-reset-otp-index="3" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" />
              <input class="otp-input" data-reset-otp-index="4" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" />
              <input class="otp-input" data-reset-otp-index="5" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" />
            </div>
          </section>

          <section class="flip-face flip-back">
            <h2 class="face-title">Set New Password</h2>
            <p id="verifiedEmailText" class="subtle"></p>
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" autocomplete="new-password" placeholder="Enter a new password" />
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter new password" />
            <button id="updatePasswordBtn" class="btn primary" type="button">Update Password</button>
          </section>
        </div>
      </div>

      <p class="text-link-wrap">
        <a class="text-link" href="/index.html">Back to Login</a>
      </p>
    </section>
  </main>

  <script src="/forgot-password.js"></script>
</body>
</html>
