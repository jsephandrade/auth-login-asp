services:
  - type: pserv
    name: auth-log-mysql
    runtime: image
    plan: starter
    region: oregon
    image:
      url: mysql:8.0
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 20
    envVars:
      - key: MYSQL_DATABASE
        value: auth_login_asp
      - key: MYSQL_USER
        value: auth_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: keyvalue
    name: auth-log-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: auth-log-web
    runtime: docker
    plan: standard
    region: oregon
    dockerContext: .
    dockerfilePath: ./AuthService/Dockerfile
    autoDeploy: true
    healthCheckPath: /healthz
    scaling:
      minInstances: 2
      maxInstances: 6
      targetMemoryPercent: 70
      targetCPUPercent: 65
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DB_HOST
        fromService:
          type: pserv
          name: auth-log-mysql
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: auth-log-mysql
          property: port
      - key: DB_NAME
        fromService:
          type: pserv
          name: auth-log-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          type: pserv
          name: auth-log-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: auth-log-mysql
          envVarKey: MYSQL_PASSWORD
      - key: DB_SSLMODE
        value: None
      - key: ConnectionStrings__Redis
        fromService:
          type: keyvalue
          name: auth-log-redis
          property: connectionString
      - key: Jwt__CurrentKeyId
        value: key-render-2026-01
      - key: Jwt__Keys__0__KeyId
        value: key-render-2026-01
      - key: Jwt__Keys__0__SecretBase64
        generateValue: true
      - key: Security__Pepper
        generateValue: true
      - key: Cors__Origins__0
        value: https://auth-log-web.onrender.com
