services:
  - type: web
    runtime: static
    name: auth-log-frontend
    buildCommand: |
      rm -rf render-static
      mkdir -p render-static
      cp -R AuthService/wwwroot/. render-static/
      API_VALUE="${API_BASE_URL%/}"
      printf "window.__API_BASE_URL__ = \"%s\";\n" "$API_VALUE" > render-static/api-config.js
    staticPublishPath: ./render-static
    pullRequestPreviewsEnabled: false
    envVars:
      - key: API_BASE_URL
        value: https://auth-log-api.onrender.com

  - type: web
    name: auth-log-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./AuthService/Dockerfile
    autoDeploy: true
    healthCheckPath: /healthz
    pullRequestPreviewsEnabled: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AUTH_DB_CONNECTION
        sync: false
      - key: Jwt__CurrentKeyId
        value: key-render-2026-01
      - key: Jwt__Keys__0__KeyId
        value: key-render-2026-01
      - key: Jwt__Keys__0__SecretBase64
        generateValue: true
      - key: Security__Pepper
        generateValue: true
      - key: Cors__Origins__0
        value: https://auth-log-frontend.onrender.com
      - key: AuthCookie__SameSite
        value: None
      - key: AuthCookie__Secure
        value: true
